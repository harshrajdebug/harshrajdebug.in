<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harsh Raj · The City</title>
<meta name="description" content="Harsh Raj tests whether systems do what they report. His work is a small city you can walk through: every lit building is part of it, and nine bugs are loose in the streets.">
<meta name="theme-color" content="#1b1f33">
<meta property="og:title" content="Harsh Raj · The City">
<meta property="og:description" content="A small city you can walk through. Every building is part of Harsh Raj's work, and nine bugs are loose in the streets.">
<meta property="og:url" content="https://harshrajdebug.in/">
<link rel="canonical" href="https://harshrajdebug.in/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b1f33'/%3E%3Ctext x='14' y='22' font-family='Arial Black,Arial' font-weight='900' font-size='15' text-anchor='middle' fill='%23f6f5f2'%3EH%3C/text%3E%3Ccircle cx='24' cy='20' r='3.4' fill='%23f2c94c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="city.css?v=12">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<!-- Boot: the sky goes from night to dawn while the city builds. Static HTML so it paints on the first frame. -->
<div class="boot" id="boot" data-state="night" aria-hidden="true">
  <div class="boot__sky boot__sky--night"></div>
  <div class="boot__sky boot__sky--dawn"></div>
  <div class="boot__stars"></div>
  <div class="boot__clouds"><i></i><i></i><i></i><i></i></div>
  <div class="boot__center">
    <p class="boot__word"><span>H</span><span>a</span><span>r</span><span>s</span><span>h</span><span class="boot__sun"></span></p>
    <svg class="boot__block" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 50 16v20L32 46 14 36V16z" fill="#2c3150"/><path d="M32 26 50 16v20L32 46z" fill="#232843"/><path d="M14 16 32 26v20L14 36z" fill="#343a5c"/><path d="M32 6 50 16 32 26 14 16z" fill="#f2c94c"/><rect x="19" y="24" width="4" height="5" fill="#ffd98a"/><rect x="25" y="27" width="4" height="5" fill="#ffd98a"/><rect x="38" y="27" width="4" height="5" fill="#ffd98a"/></svg>
    <p class="boot__status" id="boot-status">Booting the cluster</p>
  </div>
</div>

<canvas id="city" aria-label="A small city at night. The gold buildings can be entered." tabindex="0"></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="fade" id="fade" aria-hidden="true"></div>

<header class="top">
  <a class="logo" href="./" aria-label="Harsh Raj, back to the city">Harsh<i></i></a>
  <div class="top__right">
    <button class="btn" id="back-city" type="button" hidden>Back to City</button>
    <button class="btn" id="fp" type="button">Enter First-Person</button>
    <div class="tools" id="tools">
      <button class="round" id="sound" type="button" aria-pressed="false" aria-label="Sound off">
        <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="sound-on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path class="sound-off" d="m16.5 9.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="tools__more" id="tools-more" hidden>
        <button class="round" id="share" type="button" aria-label="Copy a link to this page">
          <svg viewBox="0 0 24 24"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 13v6h14v-6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="round" id="daynight" type="button" aria-label="Switch to day">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="round" id="reset" type="button" aria-label="Start the tour again">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button class="round" id="settings" type="button" aria-expanded="false" aria-label="Settings">
        <svg class="ico-open" viewBox="0 0 24 24"><path d="M4 7h10m4 0h2M4 17h4m4 0h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="10" cy="17" r="2" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
        <svg class="ico-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>

<aside class="controls" id="controls" aria-label="Controls">
  <p class="controls__title">Controls <button type="button" id="controls-close" aria-label="Hide controls">×</button></p>
  <dl>
    <dt><kbd>Space</kbd> + drag</dt><dd>Pan</dd>
    <dt>Drag</dt><dd>Rotate view</dd>
    <dt>Mouse wheel</dt><dd>Zoom</dd>
  </dl>
</aside>

<nav class="dock" aria-label="Buildings">
  <button type="button" data-go="about">About</button>
  <button type="button" data-go="findings">Findings</button>
  <button type="button" data-go="built">Built</button>
  <button type="button" data-go="contact">Contact</button>
</nav>

<div class="counters" aria-live="polite">
  <span title="Buildings explored"><svg viewBox="0 0 24 24"><path d="M7 4h10v3a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4m10-4h3a3 3 0 0 1-3 4M10 14h4v3h-4zm-2 5h8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg><b id="trophies">0</b>/4</span>
  <i></i>
  <span title="Bugs found"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.2L20 12l-5.8 2.8L12 21l-2.2-6.2L4 12l5.8-2.8z" fill="currentColor"/></svg><b id="stars">0</b>/9</span>
</div>

<p class="pill-hint" id="hint">Select a gold building to go inside. Something is hiding in these streets.</p>
<p class="pill-hint" id="hint-inside" hidden>⟳ drag to rotate · click the glowing things</p>
<p class="pill-hint" id="walkhelp" hidden>W A S D to walk · drag to look · Esc to leave</p>

<!-- Guide -->
<aside class="guide" id="guide" aria-live="polite" hidden>
  <div class="guide__head">
    <span class="guide__face" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M8 20 L12 6 L20 15 Q24 14 28 15 L36 6 L40 20 Q43 27 40 34 Q34 43 24 43 Q14 43 8 34 Q5 27 8 20Z" fill="#d08a4e"/><path d="M13 23 Q17 20 20 24 M28 24 Q31 20 35 23" stroke="#3a2412" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="17" cy="27" r="2.6" fill="#1b1206"/><circle cx="31" cy="27" r="2.6" fill="#1b1206"/><path d="M22 31 L26 31 L24 33.5Z" fill="#6b3a2a"/></svg></span>
    <span><b>Pixel</b><small>City Guide</small></span>
    <span class="guide__step" id="guide-step">1 / 8</span>
    <button type="button" class="guide__x" id="guide-x" aria-label="Minimise the guide">×</button>
  </div>
  <p class="guide__text" id="guide-text"></p>
  <button type="button" class="guide__quest" id="guide-quest" hidden></button>
  <div class="guide__actions">
    <button type="button" class="gbtn" id="guide-later">Not now</button>
    <button type="button" class="gbtn gbtn--go" id="guide-go">On it!</button>
  </div>
</aside>
<button type="button" class="guide-chip" id="guide-chip" hidden><span class="guide-chip__face" aria-hidden="true"></span><span><b>Pixel · <span id="chip-step"></span></b><span id="chip-text"></span></span></button>

<div class="toast" id="toast" role="status" hidden></div>

<!-- Content cards, opened from objects inside the buildings. -->
<div class="card-wrap" id="card-wrap" hidden>
  <article class="card" id="card" role="dialog" aria-modal="false" aria-labelledby="card-title">
    <button type="button" class="card__x" id="card-x" aria-label="Close">×</button>
    <p class="card__kicker" id="card-kicker"></p>
    <h2 class="card__title" id="card-title"></h2>
    <div class="card__body" id="card-body"></div>
  </article>
</div>

<noscript><p class="noscript">This site is a small 3D city and needs JavaScript. Harsh Raj · <a href="mailto:harshrajdebug@gmail.com">harshrajdebug@gmail.com</a> · <a href="https://github.com/harshrajdebug">GitHub</a></p></noscript>

<script type="module" src="city.js?v=17"></script>
</body>
</html>
