<!doctype html>
<meta charset="utf-8">
<title>Mascot options</title>
<style>
  body { margin: 0; padding: 28px 20px; background: #0f1210; color: #d4d8d0; font: 14px/1.6 "Geist Mono", ui-monospace, monospace; }
  h1 { font-size: 15px; font-weight: 500; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1100px; }
  .card { border: 1px solid #1f2520; padding: 18px; }
  .card h2 { margin: 0 0 4px; font-size: 14px; font-weight: 500; color: #4ade80; }
  .card p { margin: 0 0 14px; color: #8b9187; font-size: 12px; }
  .row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .light { background: #f3f4f1; padding: 12px; margin-top: 12px; display: flex; gap: 12px; align-items: flex-end; }
  .tab { display: inline-flex; align-items: center; gap: 6px; background: #1f2520; padding: 5px 10px; border-radius: 6px 6px 0 0; font-size: 11px; margin-top: 12px; }
</style>
<h1>Debug bug: one mascot, three treatments</h1>
<div class="grid" id="g"></div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gGreen" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="170"><stop offset="0" stop-color="#3fd477"/><stop offset="1" stop-color="#6ee79c"/></linearGradient>
    <linearGradient id="gRed" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="170"><stop offset="0" stop-color="#ef4a57"/><stop offset="1" stop-color="#ff7a82"/></linearGradient>

    <!-- the bug itself, drawn on a 200 grid; body colour comes from --c -->
    <clipPath id="lids"><path d="M40 106C60 100 80 101 100 104 120 101 140 100 160 106V160H40Z"/></clipPath>
    <g id="bug">
      <!-- antennae: left ends in a plain knob, right one in the red breakpoint -->
      <path d="M84 70C80 52 70 40 56 34M116 70C120 52 130 40 144 34" fill="none" stroke="var(--c)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="53" cy="32" r="11" fill="var(--c)"/>
      <circle cx="147" cy="32" r="11" fill="var(--dot, #f87171)" stroke="var(--ring, #0f1210)" stroke-width="4"/>
      <!-- legs -->
      <path d="M50 118L32 112 24 100M47 138L27 140 19 152M58 158L46 170 46 184M150 118L168 112 176 100M153 138L173 140 181 152M142 158L154 170 154 184" fill="none" stroke="var(--c)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- body: a squat shell, flat-ish top, round belly -->
      <path d="M100 64C136 64 158 88 158 122C158 152 134 170 100 170S42 152 42 122C42 88 64 64 100 64Z" fill="var(--fill)"/>
      <!-- eyes: big, half-lidded, glancing up and aside, the look of someone reading a log line twice -->
      <g clip-path="url(#lids)">
        <ellipse cx="78" cy="116" rx="19" ry="24" fill="#fff"/>
        <ellipse cx="122" cy="116" rx="19" ry="24" fill="#fff"/>
        <ellipse cx="86" cy="112" rx="8.5" ry="12" fill="#0f1210"/>
        <ellipse cx="130" cy="112" rx="8.5" ry="12" fill="#0f1210"/>
      </g>
    </g>

    <symbol id="green" viewBox="0 0 200 200" style="--c:#4ade80;--fill:url(#gGreen)"><rect width="200" height="200" rx="44" fill="#0f1210"/><use href="#bug"/></symbol>
    <symbol id="plain" viewBox="0 0 200 200" style="--c:#ef4a57;--fill:url(#gRed);--dot:#0f1210;--ring:#fff"><use href="#bug"/></symbol>
    <symbol id="tile" viewBox="0 0 200 200" style="--c:#0f1210;--fill:#0f1210"><rect width="200" height="200" rx="44" fill="#4ade80"/><use href="#bug"/></symbol>
  </defs>
</svg>
<script>
  const info = {
    green: ["1. Green on dark", "Matches the site as it is: terminal green bug, red breakpoint on its right antenna."],
    plain: ["2. Red, no background", "The treatment from your reference: a bold flat character on white, gradient body."],
    tile:  ["3. Dark bug on green tile", "A silhouette. Loudest at favicon size."],
  };
  const use = (id, s) => `<svg width="${s}" height="${s}" viewBox="0 0 200 200"><use href="#${id}"/></svg>`;
  document.getElementById("g").innerHTML = Object.entries(info).map(([id, [t, d]]) => `
    <div class="card">
      <h2>${t}</h2><p>${d}</p>
      <div class="row">${use(id, 180)}${use(id, 48)}${use(id, 32)}${use(id, 16)}</div>
      <div class="light">${use(id, 64)}${use(id, 32)}${use(id, 16)}</div>
      <div class="tab">${use(id, 16)} harshrajdebug.in</div>
    </div>`).join("");
</script>
